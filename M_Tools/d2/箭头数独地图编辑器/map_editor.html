<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图编辑器</title>
    <link rel="stylesheet" href="map_editor.css">
</head>
<body>
    <div class="container">
        <h1>地图编辑器</h1>
        <div class="controls">
            <button id="drawMode">绘制模式</button>
            <button id="edgeMode">边缘检测</button>
            <button id="arrowMode">箭头模式</button>
            <button id="randomArrows">随机箭头</button>
            <button id="clear">清空地图</button>
            
            <div class="grid-size-control">
                <label for="gridSize">格子大小:</label>
                <input type="number" id="gridSize" min="5" max="30" value="20">
            </div>
            
            <div class="grid-dimensions-control">
                <label for="gridRows">行数:</label>
                <input type="number" id="gridRows" min="5" max="20" value="20">
                <label for="gridCols">列数:</label>
                <input type="number" id="gridCols" min="5" max="20" value="20">
                <button id="applyGridSettings">应用设置</button>
                <span id="gridInfo">(20x20)</span>
            </div>
            
            <button id="save">保存地图</button>
            <button id="load">加载地图</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
        </div>
        <div class="game-container">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>
        <div class="info">
            <p>当前模式: <span id="currentMode">绘制模式</span></p>
            <p>操作说明: 左键点击/拖拽绘制图形，右键点击/拖拽擦除格子，边缘检测后会生成数字和箭头</p>
        </div>
    </div>
    <script src="map_editor.js"></script>
</body>
</html>
